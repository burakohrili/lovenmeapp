name: lovenme
description: "Venue-based community platform with mayor system for real-world connections. Connect with people through shared favorite places and become mayor of venues you love."
publish_to: 'none'
version: 1.2.0+45

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cerceve metinleri (Kes/Kopyala/Yapistir, tarih secici, "Back") icin.
  # Bu paket yoktu; Flutter varsayilan olarak ABD Ingilizcesine dusuyor,
  # Turkce arayuzun icinde Ingilizce sistem metinleri cikiyordu.
  flutter_localizations:
    sdk: flutter

  flutter_sound: ^9.2.13
  path_provider: ^2.1.1
  
  google_maps_flutter: ^2.5.0
  google_maps_flutter_android: ^2.5.0  # Android optimization için
  google_maps_flutter_platform_interface: ^2.4.0

  firebase_core: ^3.8.0
  
  # Firebase Auth
  firebase_auth: ^5.3.3
  
  # Cloud Firestore
  cloud_firestore: ^5.5.0

  
  # Firebase Storage
  firebase_storage: ^12.3.7
  
  # Firebase Messaging (Push Notifications)
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  
  # Firebase Analytics
  firebase_analytics: ^11.3.6

  firebase_crashlytics: ^4.3.10  # Crash reporting için
  
  
  # State Management
  flutter_riverpod: ^2.4.9

  intl: ^0.20.2

  # UI & Loading
  lottie: ^3.1.2
  video_player: ^2.8.0
  
  # In-App Purchase
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.8+1
  
  # Google Sign In
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  
  # Image Picker
  http: ^1.4.0
  image_picker: ^1.0.4
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.2

  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.1+4

  # Sabitlenmemis surum, transitif major bump build'i bozabilirdi.
  path: ^1.9.0
  flutter_cache_manager: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - lib/images/logos/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/logos/lovenme_logo_resized.png"
  min_sdk_android: 21
  remove_alpha_ios: true
